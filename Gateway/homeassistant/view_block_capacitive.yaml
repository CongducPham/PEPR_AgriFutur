##start xxname
##start capacitive block
      - type: vertical-stack
        cards:
          - type: entities
            title: Capacitive Sensor
            entities:
              - entity: sensor.xxname_raw_value_from_sen0308
                secondary_info: last-updated
              - entity: sensor.xxname_soil_temperature_sensor
                secondary_info: last-updated
                icon: mdi:thermometer                 
              - entity: sensor.xxname_battery_voltage
                secondary_info: last-updated
                icon: mdi:battery
          - type: grid
            columns: 2
            cards:
              - type: picture
                image: /local/sensors/capacitive_temp.png
              - type: gauge
                entity: sensor.xxname_raw_value_from_sen0308
                needle: true
                min: -1
                max: 550
                segments:
                  - from: -1
                    color: '#000000'
                  - from: 0
                    color: '#139feb'
                  - from: 84
                    color: '#15a43e'
                  - from: 167
                    color: '#9ac97b'
                  - from: 250
                    color: '#fdc009'
                  - from: 334
                    color: '#fb2041'
                  - from: 416
                    color: '#d1000f'
              - type: sensor
                entity: sensor.xxname_soil_condition
                secondary_info: last-updated
              - type: picture-entity
                entity: sensor.xxname_soil_value_index
                secondary_info: last-updated
                image: /local/sensors/no_sensor.svg
                style:
                  width: 10%
                show_name: false
                show_state: false
                state_image:
                  '0': /local/sensors/level0.svg
                  '1': /local/sensors/level1.svg
                  '2': /local/sensors/level2.svg
                  '3': /local/sensors/level3.svg
                  '4': /local/sensors/level4.svg
                  '5': /local/sensors/level5.svg
                  '-2': /local/sensors/no_sensor.svg
                  '-1': /local/sensors/no_sensor.svg
##end capacitive block - leave CR at end of this line
##end xxname
