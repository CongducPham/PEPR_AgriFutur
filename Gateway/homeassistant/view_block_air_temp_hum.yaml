##start air_temp_hum block
      - type: vertical-stack
        cards:
          - type: entities
            title: Air Temp/Hum Sensor
            entities:               
              - entity: sensor.xxname_degree_celsius
                secondary_info: last-updated
                icon: mdi:thermometer                
              - entity: sensor.xxname_relative_humidity
                secondary_info: last-updated
                icon: mdi:water-percent
              - entity: sensor.xxname_soil_temperature_sensor
                secondary_info: last-updated
                icon: mdi:thermometer                
              - entity: sensor.xxname_battery_voltage
                secondary_info: last-updated
                icon: mdi:battery
          - type: grid
            columns: 2
            cards:
              - type: picture
                image: /local/sensors/air_temp_hum.png
              - type: history-graph
                entities:
                  - entity: sensor.xxname_degree_celsius
                  - entity: sensor.xxname_relative_humidity
