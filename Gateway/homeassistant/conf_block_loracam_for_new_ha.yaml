## start loracam block
sensor loracam:  
  - platform: rest
    resource: http://localhost/devices/XXDEV/sensors/analogOutput_10/value
    name: XXNAME/number of packets
    unit_of_measurement: "pkt"   
  - platform: rest
    resource: http://localhost/devices/XXDEV/sensors/analogOutput_11/value
    name: XXNAME/size in bytes
    value_template: "{{ value_json | multiply(1000) | round(0)}}"      
    unit_of_measurement: "bytes"  
  - platform: rest
    resource: http://localhost/devices/XXDEV/sensors/analogOutput_12/value
    name: XXNAME/time on air
    unit_of_measurement: "min:sec"  
  - platform: rest
    resource: http://localhost/devices/XXDEV/sensors/analogOutput_13/value
    name: XXNAME/luminosity  
    unit_of_measurement: ""

