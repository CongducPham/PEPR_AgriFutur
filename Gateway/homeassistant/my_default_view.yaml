title: Farm
views:
  - path: default_view
    title: Home
    cards:
##start capacitive block
      - type: vertical-stack
        cards:
          - type: entities
            title: Capacitive Sensor
            entities:
              - entity: sensor.capacitive_1_raw_value_from_sen0308
                secondary_info: last-updated
              - entity: sensor.capacitive_1_soil_temperature_sensor
                secondary_info: last-updated
                icon: mdi:thermometer                 
              - entity: sensor.capacitive_1_battery_voltage
                secondary_info: last-updated
                icon: mdi:battery
          - type: grid
            columns: 2
            cards:
              - type: picture
                image: /local/sensors/capacitive_temp.png
              - type: gauge
                entity: sensor.capacitive_1_raw_value_from_sen0308
                needle: true
                min: -1
                max: 550
                segments:
                  - from: -1
                    color: '#000000'
                  - from: 0
                    color: '#139feb'
                  - from: 84
                    color: '#15a43e'
                  - from: 167
                    color: '#9ac97b'
                  - from: 250
                    color: '#fdc009'
                  - from: 334
                    color: '#fb2041'
                  - from: 416
                    color: '#d1000f'
              - type: sensor
                entity: sensor.capacitive_1_soil_condition
                secondary_info: last-updated
              - type: picture-entity
                entity: sensor.capacitive_1_soil_value_index
                secondary_info: last-updated
                image: /local/sensors/no_sensor.svg
                style:
                  width: 10%
                show_name: false
                show_state: false
                state_image:
                  '0': /local/sensors/level0.svg
                  '1': /local/sensors/level1.svg
                  '2': /local/sensors/level2.svg
                  '3': /local/sensors/level3.svg
                  '4': /local/sensors/level4.svg
                  '5': /local/sensors/level5.svg
                  '-2': /local/sensors/no_sensor.svg
                  '-1': /local/sensors/no_sensor.svg
##end capacitive block - leave CR at end of this line
##start tensiometer block
      - type: vertical-stack
        cards:
          - type: entities
            title: Tensiometer Sensor
            entities:
              - entity: sensor.tensiometer_1_centibars_from_wm200
                secondary_info: last-changed
              - entity: sensor.tensiometer_1_resistance_value_from_wm200
                secondary_info: last-updated
              - entity: sensor.tensiometer_1_soil_temperature_sensor
                secondary_info: last-updated
                icon: mdi:thermometer
              - entity: sensor.tensiometer_1_battery_voltage
                secondary_info: last-updated
                icon: mdi:battery
          - type: grid
            columns: 2
            cards:
              - type: picture
                image: /local/sensors/tensiometer_temp.png
              - type: gauge
                entity: sensor.tensiometer_1_centibars_from_wm200
                needle: true
                min: 0
                max: 255
                segments:
                  - from: 0
                    color: '#139feb'
                  - from: 10
                    color: '#15a43e'
                  - from: 30
                    color: '#fdc009'
                  - from: 60
                    color: '#fb2041'
                  - from: 100
                    color: '#d1000f'
                  - from: 240
                    color: '#000000'
              - type: sensor
                entity: sensor.tensiometer_1_soil_condition
                secondary_info: last-updated
              - type: picture-entity
                entity: sensor.tensiometer_1_soil_value_index
                secondary_info: last-updated
                image: /local/sensors/no_sensor.svg
                show_name: false
                show_state: false
                state_image:
                  '0': /local/sensors/level0.svg
                  '1': /local/sensors/level1.svg
                  '2': /local/sensors/level2.svg
                  '3': /local/sensors/level3.svg
                  '4': /local/sensors/level4.svg
                  '5': /local/sensors/level5.svg
                  '-2': /local/sensors/no_sensor.svg
                  '-1': /local/sensors/no_sensor.svg
##end tensiometer block  - leave CR at end of this line
##start co2 block
      - type: vertical-stack
        cards:
          - type: entities
            title: CO2 Sensor
            entities:
              - entity: sensor.co2_1_co2_ppm
                secondary_info: last-changed
                icon: mdi:molecule-co2                  
              - entity: sensor.co2_1_degree_celsius
                secondary_info: last-updated
                icon: mdi:thermometer                
              - entity: sensor.co2_1_relative_humidity
                secondary_info: last-updated
                icon: mdi:water-percent
              - entity: sensor.co2_1_soil_temperature_sensor
                secondary_info: last-updated
                icon: mdi:thermometer                
              - entity: sensor.co2_1_battery_voltage
                secondary_info: last-updated
                icon: mdi:battery
          - type: grid
            columns: 2
            cards:
              - type: picture
                image: /local/sensors/co2_temp.png
              - type: gauge
                entity: sensor.co2_1_co2_ppm
                needle: true
                min: 0
                max: 7000
                segments:
                  - from: 0
                    color: '#108cd9'
                  - from: 600
                    color: '#128c91'
                  - from: 800
                    color: '#409d2c'                    
                  - from: 1000
                    color: '#f8bc09'
                  - from: 1200
                    color: '#ee9630'                    
                  - from: 2000
                    color: '#e15a1a'
                  - from: 5000
                    color: '#d41921'
                  - from: 6000
                    color: '#000000'
