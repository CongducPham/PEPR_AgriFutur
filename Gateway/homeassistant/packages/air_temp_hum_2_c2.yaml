## start air_temp_hum block
sensor air_temp_hum:  
  - platform: rest
    resource: http://localhost/devices/69aaaa5668f3190aa42a1224/sensors/temperatureSensor_7/value
    name: AIR_TEMP_HUM_2/degree Celsius
    unit_of_measurement: "°C"
  - platform: rest
    resource: http://localhost/devices/69aaaa5668f3190aa42a1224/sensors/temperatureSensor_8/value
    name: AIR_TEMP_HUM_2/relative humidity
    unit_of_measurement: "%RH"
  - platform: rest
    resource: http://localhost/devices/69aaaa5668f3190aa42a1224/sensors/temperatureSensor_5/value
    name: AIR_TEMP_HUM_2/Soil Temperature Sensor
    unit_of_measurement: "°C"  
  - platform: rest
    resource: http://localhost/devices/69aaaa5668f3190aa42a1224/sensors/analogInput_6/value
    name: AIR_TEMP_HUM_2/Battery voltage  
    unit_of_measurement: "Volts"
## end air_temp_hum block