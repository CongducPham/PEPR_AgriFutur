## start co2 block
sensor co2:  
  - platform: rest
    resource: http://localhost/devices/69aaaac868f3190aa42a122b/sensors/temperatureSensor_9/value
    name: CO2_2/CO2 ppm
    unit_of_measurement: "ppm"
  - platform: rest
    resource: http://localhost/devices/69aaaac868f3190aa42a122b/sensors/temperatureSensor_7/value
    name: CO2_2/degree Celsius
    unit_of_measurement: "°C"
  - platform: rest
    resource: http://localhost/devices/69aaaac868f3190aa42a122b/sensors/temperatureSensor_8/value
    name: CO2_2/relative humidity
    unit_of_measurement: "%RH"
  - platform: rest
    resource: http://localhost/devices/69aaaac868f3190aa42a122b/sensors/temperatureSensor_5/value
    name: CO2_2/Soil Temperature Sensor
    unit_of_measurement: "°C"  
  - platform: rest
    resource: http://localhost/devices/69aaaac868f3190aa42a122b/sensors/analogInput_6/value
    name: CO2_2/Battery voltage  
    unit_of_measurement: "Volts"
## end co2 block