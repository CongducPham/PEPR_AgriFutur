## start loracam block
sensor loracam:  
  - platform: rest
    resource: http://localhost/devices/69aaacd068f3190aa42a123d/sensors/analogOutput_10/value
    name: LoRaCAM_AI_STATS_2EAB/number of packets
    unit_of_measurement: "pkt"   
  - platform: rest
    resource: http://localhost/devices/69aaacd068f3190aa42a123d/sensors/analogOutput_11/value
    name: LoRaCAM_AI_STATS_2EAB/size in bytes
    value_template: "{{ value_json | multiply(1000) | round(0)}}"      
    unit_of_measurement: "bytes"  
  - platform: rest
    resource: http://localhost/devices/69aaacd068f3190aa42a123d/sensors/analogOutput_12/value
    name: LoRaCAM_AI_STATS_2EAB/time on air
    unit_of_measurement: "min:sec"  
  - platform: rest
    resource: http://localhost/devices/69aaacd068f3190aa42a123d/sensors/analogOutput_13/value
    name: LoRaCAM_AI_STATS_2EAB/luminosity  
    unit_of_measurement: ""

#from https://community.home-assistant.io/t/refresh-cached-images-in-lovelace-picture-elements-maybe-other-places-too/98351/18
camera:
  - platform: local_file
    name: LoRaCAM_AI_DEV_2DAB
    file_path: /config/www/loracam-ai/last-LoRaCAM_AI_DEV_2DAB-image.bmp
## end loracam block