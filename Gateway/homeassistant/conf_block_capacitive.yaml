## start capacitive block
sensor:
  - platform: rest
    resource: http://localhost/devices/XXDEV/sensors/temperatureSensor_0/value
    name: XXNAME/Raw value from SEN0308
  - platform: rest
    resource: http://localhost/devices/XXDEV/sensors/temperatureSensor_5/value
    name: XXNAME/Soil Temperature Sensor
    unit_of_measurement: "°C"    
  - platform: rest
    resource: http://localhost/devices/XXDEV/sensors/analogInput_6/value
    name: XXNAME/Battery voltage
    unit_of_measurement: "Volts"
    
template:
  - sensor:
    - name: XXNAME/soil value index
      state: >
        {% set raw = states('sensor.xxname_raw_value_from_sen0308') | int(0) %}
        {% if raw < 0 %}
          {{ -1 }}
        {% else %}      
          {% set capacitive_sensor_dry_max = 500 %}
          {% set capacitive_sensor_n_interval = 6 %}
          {% set interval = (capacitive_sensor_dry_max / capacitive_sensor_n_interval) %}
          {% set idx = (raw / interval) | int %}
          {% if idx >= capacitive_sensor_n_interval %}
            {% set idx = capacitive_sensor_n_interval - 1 %}
          {% endif %}
          {{ (capacitive_sensor_n_interval - 1 - idx) }}
        {% endif %}
          
  - sensor:
    - name: XXNAME/soil condition
      state: >
        {% set idx = states('sensor.xxname_soil_value_index') | int(0) %}
        {% if idx == -1 %}
          no sensor         
        {% elif idx == 0 %}
          very dry
        {% elif idx == 1 %}
          dry     
        {% elif idx == 2 %}
          dry-wet   
        {% elif idx == 3 %}
          wet-dry   
        {% elif idx == 4 %}
          wet 
        {% else %}
          saturated
        {% endif %}
## end capacitive block