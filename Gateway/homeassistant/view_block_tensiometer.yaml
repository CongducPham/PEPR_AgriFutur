##start xxname
##start tensiometer block
      - type: vertical-stack
        cards:
          - type: entities
            title: Tensiometer Sensor
            entities:
              - entity: sensor.xxname_centibars_from_wm200
                secondary_info: last-changed
              - entity: sensor.xxname_resistance_value_from_wm200
                secondary_info: last-updated
              - entity: sensor.xxname_soil_temperature_sensor
                secondary_info: last-updated
                icon: mdi:thermometer
              - entity: sensor.xxname_battery_voltage
                secondary_info: last-updated
                icon: mdi:battery
          - type: grid
            columns: 2
            cards:
              - type: picture
                image: /local/sensors/tensiometer_temp.png
              - type: gauge
                entity: sensor.xxname_centibars_from_wm200
                needle: true
                min: 0
                max: 255
                segments:
                  - from: 0
                    color: '#139feb'
                  - from: 10
                    color: '#15a43e'
                  - from: 30
                    color: '#fdc009'
                  - from: 60
                    color: '#fb2041'
                  - from: 100
                    color: '#d1000f'
                  - from: 240
                    color: '#000000'
              - type: sensor
                entity: sensor.xxname_soil_condition
                secondary_info: last-updated
              - type: picture-entity
                entity: sensor.xxname_soil_value_index
                secondary_info: last-updated
                image: /local/sensors/no_sensor.svg
                show_name: false
                show_state: false
                state_image:
                  '0': /local/sensors/level0.svg
                  '1': /local/sensors/level1.svg
                  '2': /local/sensors/level2.svg
                  '3': /local/sensors/level3.svg
                  '4': /local/sensors/level4.svg
                  '5': /local/sensors/level5.svg
                  '-2': /local/sensors/no_sensor.svg
                  '-1': /local/sensors/no_sensor.svg
##end tensiometer block  - leave CR at end of this line
##end xxname
